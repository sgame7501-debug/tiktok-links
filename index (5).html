<title>Мои ссылки — Shinra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#030615; --bg2:#07123e; --cyan:#19e3ff; --blue:#1f6bff; --violet:#5a2bff;
  --text:#f3f8ff; --muted:#8bb4e8; --card:rgba(8,22,70,.55); --line:rgba(25,227,255,.35);
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);background:var(--bg);
  display:flex;justify-content:center;
  padding:calc(36px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;position:relative;
}
/* фон: свечение + сетка */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(60% 40% at 50% 0%,rgba(31,107,255,.55),transparent 70%),
    radial-gradient(50% 35% at 100% 55%,rgba(90,43,255,.28),transparent 70%),
    radial-gradient(50% 35% at 0% 80%,rgba(25,227,255,.16),transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg) 70%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(25,227,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(25,227,255,.06) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 0,transparent 70%);
          mask-image:radial-gradient(ellipse at 50% 20%,#000 0,transparent 70%);
}
main{width:100%;max-width:460px;text-align:center}

/* аватар */
.avatar-wrap{position:relative;width:164px;height:164px;margin:0 auto 22px}
.avatar-wrap::before{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--cyan),var(--violet),var(--blue),var(--cyan));
  filter:blur(.4px);animation:spin 8s linear infinite;
}
.avatar-wrap::after{
  content:"";position:absolute;inset:-18px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(25,227,255,.45),transparent 68%);
}
.avatar{
  position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 50%;
  border:4px solid var(--bg);background:#091747;display:block;
}
@keyframes spin{to{transform:rotate(360deg)}}

h1{
  font-family:'Unbounded','Manrope',system-ui,sans-serif;
  font-weight:800;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;line-height:1.1;
  background:linear-gradient(90deg,#e6fbff,var(--cyan) 55%,#8aa7ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(25,227,255,.45));
}
.sub{color:var(--muted);font-weight:700;font-size:15px;margin:10px 0 30px}

/* ссылки */
.links{display:grid;gap:14px}
.link{
  position:relative;display:flex;align-items:center;gap:16px;text-align:left;
  padding:14px 18px 14px 14px;border-radius:22px;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(0,20,90,.45),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
a.link:hover,a.link:focus-visible{
  transform:translateY(-3px);border-color:var(--cyan);
  box-shadow:0 12px 36px rgba(0,120,255,.45),0 0 0 1px var(--cyan),inset 0 1px 0 rgba(255,255,255,.12);
}
a.link:active{transform:translateY(0) scale(.99)}
a.link:focus-visible{outline:2px solid #fff;outline-offset:3px}

.icon{
  width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;border-radius:16px;
  background:linear-gradient(145deg,var(--cyan),var(--blue));
  box-shadow:0 0 22px rgba(25,227,255,.5);color:#031030;
}
.icon svg{width:28px;height:28px;fill:currentColor}
.text{display:flex;flex-direction:column;gap:3px;min-width:0}
.label{font-size:17px;font-weight:800}
.handle{font-size:14px;font-weight:500;color:var(--muted)}
.arrow{margin-left:auto;width:22px;height:22px;flex:0 0 22px;color:var(--cyan);transition:transform .18s}
a.link:hover .arrow{transform:translate(3px,-3px)}

/* «скоро» */
.soon{cursor:default;background:rgba(8,22,70,.3);border-style:dashed;border-color:rgba(90,130,230,.4);box-shadow:none}
.soon .icon{background:rgba(40,64,140,.55);box-shadow:none;color:#8da6e6}
.soon .label{color:#c2d3f5}
.badge{
  margin-left:auto;font-size:12.5px;font-weight:700;color:#9fb8ee;
  padding:6px 12px;border-radius:999px;border:1px solid rgba(120,150,235,.4);background:rgba(20,40,110,.5);white-space:nowrap;
}

.footer{margin-top:34px;color:var(--cyan);font-weight:700;font-size:15px}
.heart{display:block;margin:8px auto 0;width:26px;height:26px;fill:var(--cyan);filter:drop-shadow(0 0 8px var(--cyan));animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}20%{transform:scale(1.18)}40%{transform:scale(1.05)}}

@media (prefers-reduced-motion:reduce){
  .avatar-wrap::before,.heart{animation:none}
  .link,.arrow{transition:none}
}
</style>
